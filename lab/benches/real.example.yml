# Настоящие железки. Этот файл — образец; свой клади рядом как
# «real.local.yml», он закрыт .gitignore: в нём адреса и логины стенда,
# а им в публичном репозитории не место.
#
#   pytest --bench real.local
#
# В образце стоят имена из домена, зарезервированного под документацию
# (RFC 2606). Адресов здесь нет намеренно: ни одного адреса настоящей сети
# в репозитории быть не должно, даже в примере. В своём файле пиши что
# угодно — имя или адрес, оба уходят в подключение как есть.
#
# Паролей здесь нет и не будет: берутся из BENCH_PASSWORD или из
# BENCH_PASSWORD_<ИМЯ УЗЛА> для разных железок.
kind: real
nodes:
  cpe1:
    address: cpe1.example.net
    profile: cpe-generic
    user: netops
  cpe2:
    address: cpe2.example.net
    profile: cpe-generic
  sw1:
    address: sw1.example.net
    profile: l3-switch
    port: 22
